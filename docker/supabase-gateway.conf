# Exposes PostgREST under the /rest/v1 path that Supabase clients use, so the
# builder's existing Supabase probe and the generated @supabase/supabase-js
# client both work against the local container unmodified.

server {
  listen 8000;
  server_name _;

  location /health {
    default_type text/plain;
    return 200 'ok';
  }

  location /rest/v1/ {
    proxy_pass http://parity-supabase-rest:8081/;
    proxy_set_header Host $host;
    proxy_set_header Accept-Profile public;
    proxy_set_header Content-Profile public;
  }
}
